<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tabitha's — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:   #C8860A;
    --amber:  #E6A020;
    --dark:   #0E0900;
    --card:   #1A1206;
    --border: #2A1E08;
    --cream:  #F5EDD8;
    --muted:  #7A6040;
    --red:    #C8102E;
    --green:  #2E8B3A;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--dark); color:var(--cream); font-family:'DM Sans',sans-serif; min-height:100vh; padding-bottom:32px; }

  /* ── LOGIN ── */
  .login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }
  .login-icon { font-size: 56px; margin-bottom: 16px; }
  .login-title { font-family:'Playfair Display',serif; font-size:24px; color:var(--cream); margin-bottom:6px; }
  .login-sub { font-size:13px; color:var(--muted); margin-bottom:32px; }
  .pin-input {
    width: 100%;
    max-width: 260px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--cream);
    font-size: 28px;
    letter-spacing: 0.3em;
    padding: 16px;
    text-align: center;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .pin-input:focus { border-color: var(--gold); }
  .pin-btn {
    width: 100%;
    max-width: 260px;
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 3px;
    font-size: 15px;
    font-weight: 800;
    padding: 16px;
    cursor: pointer;
    font-family: 'DM Sans',sans-serif;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .pin-btn:active { background: var(--amber); }
  .pin-error { font-size:13px; color:#e04060; margin-top:12px; display:none; }

  /* ── MAIN HEADER ── */
  .main-header {
    background: linear-gradient(180deg,#1a0f00 0%,var(--dark) 100%);
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .main-header-title { font-family:'Playfair Display',serif; font-size:20px; color:var(--cream); }
  .main-header-sub { font-size:11px; color:var(--muted); margin-top:3px; }
  .logout-btn { background:transparent; border:1px solid var(--border); color:var(--muted); font-size:12px; padding:7px 14px; border-radius:2px; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .logout-btn:active { border-color:var(--gold); color:var(--gold); }

  /* ── NAV TABS ── */
  .tabs { display:flex; background:#0a0600; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab { flex:1; min-width:80px; padding:12px 4px; text-align:center; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:color 0.2s, border-color 0.2s; white-space:nowrap; }
  .tab.active { color:var(--gold); border-bottom-color:var(--gold); }

  /* ── LOADING ── */
  .loading-box { text-align:center; padding:60px 24px; color:var(--muted); }
  .spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── SUMMARY CARDS ── */
  .summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px; }
  .summary-card { background:var(--card); border:1px solid var(--border); border-radius:3px; padding:14px; }
  .summary-card.wide { grid-column:1/-1; }
  .summary-label { font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .summary-value { font-size:28px; font-weight:800; color:var(--cream); }
  .summary-value.gold { color:var(--gold); }
  .summary-value.green { color:#4eca60; }
  .summary-value.amber { color:var(--amber); }

  /* ── REFUND ALERT ── */
  .refund-alert { background:rgba(200,16,46,0.12); border:1px solid rgba(200,16,46,0.35); border-radius:3px; margin:0 16px 12px; padding:12px 14px; }
  .refund-alert-title { font-size:12px; font-weight:800; color:#e04060; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; }
  .refund-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(200,16,46,0.15); }
  .refund-item:last-child { border:none; }
  .refund-info { font-size:12px; }
  .refund-name  { color:var(--cream); font-weight:600; }
  .refund-phone { color:var(--muted); font-size:11px; }
  .refund-total { font-size:13px; font-weight:700; color:#e04060; margin-right:8px; }
  .refund-done-btn { background:transparent; border:1px solid rgba(200,16,46,0.5); color:#e04060; font-size:11px; font-weight:700; padding:5px 10px; border-radius:2px; cursor:pointer; font-family:'DM Sans',sans-serif; white-space:nowrap; }
  .refund-done-btn:active { background:rgba(200,16,46,0.2); }

  /* ── FILTER BAR ── */
  .filter-bar { display:flex; gap:8px; padding:10px 16px; overflow-x:auto; }
  .filter-chip { background:var(--card); border:1px solid var(--border); border-radius:12px; font-size:11px; font-weight:700; padding:6px 14px; color:var(--muted); cursor:pointer; white-space:nowrap; transition:all 0.15s; }
  .filter-chip.active { background:rgba(200,134,10,0.12); border-color:var(--gold); color:var(--gold); }

  /* ── ORDER CARDS ── */
  .orders-list { padding:0 16px; }
  .order-card { background:var(--card); border:1px solid var(--border); border-radius:3px; margin-bottom:12px; overflow:hidden; }
  .order-card.status-pending   { border-left:3px solid var(--amber); }
  .order-card.status-confirmed { border-left:3px solid var(--gold); }
  .order-card.status-preparing { border-left:3px solid #5b9fe6; }
  .order-card.status-ready     { border-left:3px solid #4eca60; }
  .order-card.status-on_the_way{ border-left:3px solid #a855f7; }
  .order-card.status-done      { border-left:3px solid var(--muted); opacity:0.8; }
  .order-card.status-cancelled  { border-left:3px solid var(--red); opacity:0.6; }

  .order-top { padding:12px 14px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .order-id { font-size:12px; font-weight:800; color:var(--gold); letter-spacing:0.04em; }
  .order-meta { font-size:11px; color:var(--muted); margin-top:3px; line-height:1.5; }
  .order-name { font-size:14px; font-weight:700; color:var(--cream); margin-top:2px; }
  .order-phone { font-size:12px; color:var(--muted); }
  .status-badge { font-size:9px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; padding:4px 10px; border-radius:1px; white-space:nowrap; }
  .badge-PENDING    { background:rgba(230,160,32,0.15); color:var(--amber); }
  .badge-CONFIRMED  { background:rgba(200,134,10,0.15); color:var(--gold); }
  .badge-PREPARING  { background:rgba(91,159,230,0.15); color:#5b9fe6; }
  .badge-READY      { background:rgba(78,202,96,0.15); color:#4eca60; }
  .badge-ON_THE_WAY { background:rgba(168,85,247,0.15); color:#a855f7; }
  .badge-DONE       { background:rgba(122,96,64,0.15); color:var(--muted); }
  .badge-CANCELLED  { background:rgba(200,16,46,0.15); color:#e04060; }

  .order-items-list { padding:0 14px 10px; font-size:12px; color:var(--muted); line-height:1.7; }
  .order-items-list strong { color:var(--cream); font-weight:600; }

  .order-total-row { padding:8px 14px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .order-total-label { font-size:11px; color:var(--muted); }
  .order-total-val { font-size:15px; font-weight:800; color:var(--gold); }

  .order-notes { padding:6px 14px 2px; font-size:11px; color:var(--muted); font-style:italic; }

  /* Action buttons */
  .order-actions { padding:10px 14px 14px; display:flex; gap:8px; flex-wrap:wrap; }
  .action-btn {
    flex: 1;
    min-width: 100px;
    padding: 9px 6px;
    border-radius: 2px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: 'DM Sans',sans-serif;
    text-align: center;
    transition: opacity 0.15s;
  }
  .action-btn:active { opacity:0.75; }
  .btn-confirm  { background:rgba(200,134,10,0.15); border-color:var(--gold); color:var(--gold); }
  .btn-prepare  { background:rgba(91,159,230,0.15); border-color:#5b9fe6; color:#5b9fe6; }
  .btn-ready    { background:rgba(78,202,96,0.15); border-color:#4eca60; color:#4eca60; }
  .btn-dispatch { background:rgba(168,85,247,0.15); border-color:#a855f7; color:#a855f7; }
  .btn-done     { background:rgba(122,96,64,0.15); border-color:var(--muted); color:var(--muted); }
  .btn-cancel   { background:rgba(200,16,46,0.1); border-color:rgba(200,16,46,0.4); color:#e04060; }

  /* Refresh btn */
  .refresh-row { display:flex; justify-content:space-between; align-items:center; padding:10px 16px 4px; }
  .refresh-label { font-size:11px; color:var(--muted); }
  .refresh-btn { background:transparent; border:1px solid var(--border); color:var(--muted); font-size:12px; font-weight:600; padding:6px 14px; border-radius:2px; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .refresh-btn:active { color:var(--gold); border-color:var(--gold); }

  /* No orders */
  .no-orders { text-align:center; padding:48px 24px; color:var(--muted); font-size:14px; }

  /* Cancel modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center; padding:24px; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#140e02; border:1px solid var(--gold); border-radius:4px; padding:24px; width:100%; max-width:340px; }
  .modal-title { font-family:'Playfair Display',serif; font-size:18px; color:var(--cream); margin-bottom:8px; }
  .modal-sub { font-size:12px; color:var(--muted); margin-bottom:16px; }
  .modal-input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:3px; color:var(--cream); font-size:14px; padding:12px 14px; font-family:'DM Sans',sans-serif; outline:none; margin-bottom:16px; }
  .modal-input:focus { border-color:var(--gold); }
  .modal-btns { display:flex; gap:10px; }
  .modal-btn { flex:1; padding:12px; border-radius:3px; font-size:13px; font-weight:800; cursor:pointer; font-family:'DM Sans',sans-serif; letter-spacing:0.04em; border:1px solid transparent; }
  .modal-btn.cancel { background:transparent; color:var(--muted); border-color:var(--border); }
  .modal-btn.confirm { background:var(--red); color:#fff; }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen" class="login-screen">
  <div class="login-icon">🔐</div>
  <div class="login-title">Staff Dashboard</div>
  <div class="login-sub">Tabitha's Restaurant · Order Control Centre</div>
  <input class="pin-input" type="password" id="pin-input" maxlength="4" placeholder="••••" inputmode="numeric"
    onkeydown="if(event.key==='Enter') doLogin()" oninput="if(this.value.length===4) doLogin()">
  <button class="pin-btn" onclick="doLogin()">Enter</button>
  <div class="pin-error" id="pin-error">Invalid PIN — please try again</div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="main-app" style="display:none;">

  <div class="main-header">
    <div>
      <div class="main-header-title">📊 Dashboard</div>
      <div class="main-header-sub" id="header-date">Today's Orders</div>
    </div>
    <button class="logout-btn" onclick="doLogout()">Lock</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-orders" onclick="switchTab('orders')">Orders</div>
    <div class="tab" id="tab-refunds" onclick="switchTab('refunds')">Refunds</div>
    <div class="tab" id="tab-summary" onclick="switchTab('summary')">Summary</div>
  </div>

  <!-- LOADING -->
  <div id="loading-state" class="loading-box">
    <div class="spinner"></div>
    Loading orders…
  </div>

  <!-- ORDERS TAB -->
  <div id="tab-orders-content" style="display:none;">
    <div class="refresh-row">
      <span class="refresh-label" id="last-refresh-label">—</span>
      <button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>
    </div>
    <div class="filter-bar">
      <div class="filter-chip active" data-filter="ALL" onclick="applyFilter(this,'ALL')">All</div>
      <div class="filter-chip" data-filter="PENDING"   onclick="applyFilter(this,'PENDING')">Pending</div>
      <div class="filter-chip" data-filter="CONFIRMED" onclick="applyFilter(this,'CONFIRMED')">Confirmed</div>
      <div class="filter-chip" data-filter="PREPARING" onclick="applyFilter(this,'PREPARING')">Preparing</div>
      <div class="filter-chip" data-filter="READY"     onclick="applyFilter(this,'READY')">Ready</div>
      <div class="filter-chip" data-filter="ON_THE_WAY" onclick="applyFilter(this,'ON_THE_WAY')">On the Way</div>
      <div class="filter-chip" data-filter="DONE"      onclick="applyFilter(this,'DONE')">Done</div>
    </div>
    <div class="orders-list" id="orders-list"></div>
  </div>

  <!-- REFUNDS TAB -->
  <div id="tab-refunds-content" style="display:none;padding:16px 0;">
    <div id="refunds-panel"></div>
  </div>

  <!-- SUMMARY TAB -->
  <div id="tab-summary-content" style="display:none;">
    <div class="summary-grid" id="summary-panel"></div>
  </div>

</div>

<!-- ══ CANCEL MODAL ══ -->
<div class="modal-overlay" id="cancel-modal" onclick="if(event.target===this)closeCancelModal()">
  <div class="modal-box">
    <div class="modal-title">Cancel Order?</div>
    <div class="modal-sub" id="cancel-modal-sub">Order <strong id="cancel-order-id-label">—</strong></div>
    <input class="modal-input" type="text" id="cancel-reason" placeholder="Reason for cancellation (optional)">
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeCancelModal()">Back</button>
      <button class="modal-btn confirm" onclick="doCancel()">Cancel Order</button>
    </div>
  </div>
</div>

<script>
const API_URL  = 'https://script.google.com/macros/s/AKfycbwL21yH5n8XV97JTuNHGCqDEB01zoSyDZQO_YUYUb42Mm-DW9KR1apzyjV5S7kUEX0P/exec';
const PIN_KEY  = 'tabitha_dash_pin';

let staffPin   = '';
let allOrders  = [];
let refunds    = [];
let summary    = {};
let activeFilter = 'ALL';
let activeTab    = 'orders';
let cancelTarget = null;
let refreshTimer = null;

// ════════ LOGIN ════════
function doLogin() {
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;
  staffPin = pin;
  // Verify PIN by making a real API call
  apiCall({ action:'dashboard', pin }).then(data => {
    if (data.success) {
      sessionStorage.setItem(PIN_KEY, pin);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      processData(data);
      startAutoRefresh();
    } else {
      document.getElementById('pin-error').style.display = 'block';
      document.getElementById('pin-input').value = '';
    }
  }).catch(() => {
    document.getElementById('pin-error').textContent = 'Connection error — check internet and try again.';
    document.getElementById('pin-error').style.display = 'block';
  });
}

function doLogout() {
  sessionStorage.removeItem(PIN_KEY);
  staffPin = '';
  clearInterval(refreshTimer);
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-error').style.display = 'none';
}

// Auto-restore session
window.addEventListener('load', () => {
  const saved = sessionStorage.getItem(PIN_KEY);
  if (saved) {
    staffPin = saved;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    loadDashboard();
    startAutoRefresh();
  }
});

// ════════ AUTO REFRESH ════════
function startAutoRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(loadDashboard, 30000); // every 30s
}

// ════════ API ════════
async function apiCall(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}

async function loadDashboard() {
  document.getElementById('loading-state').style.display = 'block';
  document.getElementById('tab-orders-content').style.display = 'none';
  document.getElementById('tab-refunds-content').style.display = 'none';
  document.getElementById('tab-summary-content').style.display = 'none';

  try {
    const data = await apiCall({ action:'dashboard', pin: staffPin });
    if (!data.success) throw new Error(data.error || 'Failed');
    processData(data);
  } catch(err) {
    document.getElementById('loading-state').innerHTML = `<div style="text-align:center;padding:60px 24px;color:var(--muted);">⚠️ ${err.message}<br><br><button onclick="loadDashboard()" style="background:var(--gold);color:var(--dark);border:none;padding:10px 20px;border-radius:3px;font-family:'DM Sans',sans-serif;font-weight:700;cursor:pointer;">Retry</button></div>`;
  }
}

function processData(data) {
  allOrders = data.orders || [];
  refunds   = data.refundsPending || [];
  summary   = data.summary || {};

  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('last-refresh-label').textContent = 'Updated ' + new Date().toLocaleTimeString();

  const today = new Date();
  document.getElementById('header-date').textContent = today.toLocaleDateString('en-GH', { weekday:'long', day:'numeric', month:'long' });

  renderOrders();
  renderRefunds();
  renderSummary();
  switchTab(activeTab);

  // Update refunds tab indicator
  if (refunds.length > 0) {
    document.getElementById('tab-refunds').textContent = `Refunds (${refunds.length})`;
    document.getElementById('tab-refunds').style.color = '#e04060';
  } else {
    document.getElementById('tab-refunds').textContent = 'Refunds';
    document.getElementById('tab-refunds').style.color = '';
  }
}

// ════════ TABS ════════
function switchTab(tab) {
  activeTab = tab;
  ['orders','refunds','summary'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('tab-' + t + '-content').style.display = (t === tab) ? 'block' : 'none';
  });
}

// ════════ FILTER ════════
function applyFilter(el, filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderOrders();
}

// ════════ RENDER ORDERS ════════
const TYPE_LABELS = {
  'takeaway':'🥡 Takeaway','delivery_pay_now':'🛵 Delivery (prepaid)',
  'delivery_pay_collection':'💵 Delivery (pay later)','dine_in':'🍽️ Dine-in'
};

function renderOrders() {
  const list = document.getElementById('orders-list');
  let filtered = allOrders.filter(o => activeFilter === 'ALL' || o.status === activeFilter);
  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-orders">No orders found for this filter.</div>';
    return;
  }
  list.innerHTML = filtered.map(o => orderCardHTML(o)).join('');
}

function orderCardHTML(o) {
  const statusClass = 'status-' + o.status.toLowerCase().replace(/ /g,'_');
  const items = Array.isArray(o.items) ? o.items : [];
  const itemsText = items.map(i => `${i.qty}× ${i.name}`).join(', ');
  const typeLabel = TYPE_LABELS[o.orderType] || o.orderType;
  const payLabel  = o.payMethod || '—';
  const actions   = getActions(o);

  return `<div class="order-card ${statusClass}" id="ocard-${o.orderId}">
    <div class="order-top">
      <div>
        <div class="order-id">${o.orderId}</div>
        <div class="order-meta">${o.time} &nbsp;·&nbsp; ${typeLabel} &nbsp;·&nbsp; ${payLabel}</div>
        <div class="order-name">${o.name || '—'}</div>
        <div class="order-phone">${o.phone ? '📞 ' + o.phone : ''}</div>
      </div>
      <span class="status-badge badge-${o.status}">${o.status.replace(/_/g,' ')}</span>
    </div>
    <div class="order-items-list">
      <strong>Items:</strong> ${itemsText || '—'}
    </div>
    ${o.cancelReason ? `<div class="order-notes">Reason: ${o.cancelReason}</div>` : ''}
    ${o.refundStatus === 'REFUND_PENDING' ? `<div style="padding:4px 14px;font-size:11px;font-weight:700;color:#e04060;">⚠️ REFUND PENDING</div>` : ''}
    ${o.notes ? `<div class="order-notes">📝 ${o.notes}</div>` : ''}
    <div class="order-total-row">
      <span class="order-total-label">Total</span>
      <span class="order-total-val">GHS ${o.total}</span>
    </div>
    ${actions ? `<div class="order-actions">${actions}</div>` : ''}
  </div>`;
}

function getActions(o) {
  const id = o.orderId;
  switch(o.status) {
    case 'PENDING':
      return `<button class="action-btn btn-confirm" onclick="updateStatus('${id}','CONFIRMED')">✓ Confirm</button>
              <button class="action-btn btn-cancel"  onclick="openCancelModal('${id}')">✕ Cancel</button>`;
    case 'CONFIRMED':
      return `<button class="action-btn btn-prepare" onclick="updateStatus('${id}','PREPARING')">🍳 Preparing</button>
              <button class="action-btn btn-cancel"  onclick="openCancelModal('${id}')">✕ Cancel</button>`;
    case 'PREPARING':
      return `<button class="action-btn btn-ready"   onclick="updateStatus('${id}','READY')">✅ Ready</button>
              <button class="action-btn btn-cancel"  onclick="openCancelModal('${id}')">✕ Cancel</button>`;
    case 'READY':
      if (o.orderType && o.orderType.startsWith('delivery')) {
        return `<button class="action-btn btn-dispatch" onclick="updateStatus('${id}','ON_THE_WAY')">🛵 Dispatched</button>
                <button class="action-btn btn-done"     onclick="updateStatus('${id}','DONE')">✓ Done</button>`;
      }
      return `<button class="action-btn btn-done" onclick="updateStatus('${id}','DONE')">✓ Collected / Done</button>`;
    case 'ON_THE_WAY':
      return `<button class="action-btn btn-done" onclick="updateStatus('${id}','DONE')">✓ Delivered</button>`;
    default:
      return '';
  }
}

// ════════ STATUS UPDATE ════════
async function updateStatus(orderId, status) {
  const card = document.getElementById('ocard-' + orderId);
  if (card) card.style.opacity = '0.5';
  try {
    const data = await apiCall({ action:'update_status', pin:staffPin, orderId, status });
    if (data.success) {
      await loadDashboard();
    } else {
      alert('Error: ' + (data.error || 'Unknown'));
      if (card) card.style.opacity = '1';
    }
  } catch(err) {
    alert('Connection error. Try again.');
    if (card) card.style.opacity = '1';
  }
}

// ════════ CANCEL MODAL ════════
function openCancelModal(orderId) {
  cancelTarget = orderId;
  document.getElementById('cancel-order-id-label').textContent = orderId;
  document.getElementById('cancel-reason').value = '';
  document.getElementById('cancel-modal').classList.add('open');
}

function closeCancelModal() {
  document.getElementById('cancel-modal').classList.remove('open');
  cancelTarget = null;
}

async function doCancel() {
  if (!cancelTarget) return;
  const reason = document.getElementById('cancel-reason').value.trim();
  closeCancelModal();
  await updateStatusWithReason(cancelTarget, 'CANCELLED', reason);
}

async function updateStatusWithReason(orderId, status, reason) {
  const params = { action:'update_status', pin:staffPin, orderId, status };
  if (reason) params.reason = reason;
  try {
    const data = await apiCall(params);
    if (data.success) { await loadDashboard(); }
    else { alert('Error: ' + (data.error || 'Unknown')); }
  } catch(err) { alert('Connection error.'); }
}

// ════════ REFUNDS ════════
function renderRefunds() {
  const panel = document.getElementById('refunds-panel');
  if (refunds.length === 0) {
    panel.innerHTML = '<div style="text-align:center;padding:48px;color:var(--muted);font-size:14px;">✅ No pending refunds</div>';
    return;
  }
  panel.innerHTML = `<div class="refund-alert">
    <div class="refund-alert-title">⚠️ ${refunds.length} Refund${refunds.length>1?'s':''} Pending</div>
    ${refunds.map(r => `<div class="refund-item">
      <div class="refund-info">
        <div class="refund-name">${r.name || '—'}</div>
        <div class="refund-phone">${r.phone ? '📞 ' + r.phone : ''} · ${r.orderId}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="refund-total">GHS ${r.total}</span>
        <button class="refund-done-btn" onclick="markRefunded('${r.orderId}')">Mark Sent</button>
      </div>
    </div>`).join('')}
  </div>
  <div style="padding:10px 16px;font-size:11px;color:var(--muted);line-height:1.7;">
    Send MoMo refund manually to the customer, then tap <strong style="color:var(--cream)">Mark Sent</strong> to update the record.
  </div>`;
}

async function markRefunded(orderId) {
  if (!confirm(`Mark refund as SENT for ${orderId}?`)) return;
  try {
    const data = await apiCall({ action:'mark_refunded', pin:staffPin, orderId });
    if (data.success) { await loadDashboard(); }
    else { alert('Error: ' + data.error); }
  } catch(err) { alert('Connection error.'); }
}

// ════════ SUMMARY ════════
function renderSummary() {
  const panel = document.getElementById('summary-panel');
  panel.innerHTML = `
    <div class="summary-card">
      <div class="summary-label">Total Orders</div>
      <div class="summary-value">${summary.total || 0}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Pending</div>
      <div class="summary-value amber">${summary.pending || 0}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Completed</div>
      <div class="summary-value green">${summary.done || 0}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Today's Revenue</div>
      <div class="summary-value gold">GHS ${(summary.revenue || 0).toFixed(0)}</div>
    </div>
    <div class="summary-card wide">
      <div class="summary-label">Active Orders</div>
      <div class="summary-value">${allOrders.filter(o => !['DONE','CANCELLED'].includes(o.status)).length}</div>
    </div>`;
}

// Login on Enter key
document.getElementById('pin-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
