<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tabitha's Restaurant — Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:   #C8860A;
    --amber:  #E6A020;
    --dark:   #0E0900;
    --card:   #1A1206;
    --border: #2A1E08;
    --cream:  #F5EDD8;
    --muted:  #7A6040;
    --red:    #C8102E;
    --green:  #2E8B3A;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(180deg, #1a0f00 0%, var(--dark) 100%);
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .logo-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    overflow: hidden;
    margin: 0 auto 14px;
    box-shadow: 0 0 24px rgba(200,134,10,0.35);
    background: #1a1008;
  }
  .logo-ring img { width:100%; height:100%; object-fit:cover; }

  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--cream);
    letter-spacing: 0.02em;
  }
  .brand-sub {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 4px;
  }
  .brand-estd {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    margin-top: 3px;
  }

  /* ── NOTICE BANNER ── */
  .notice-banner {
    background: #1c1408;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    font-size: 11px;
    color: var(--amber);
    text-align: center;
    letter-spacing: 0.03em;
    line-height: 1.5;
  }

  /* ── LOADING / ERROR ── */
  .status-box {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── CATEGORY SECTION ── */
  .category-section { padding: 0 16px; margin-top: 24px; }

  .category-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .category-icon { font-size: 20px; }
  .category-name {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--cream);
    flex: 1;
  }
  .category-count {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── MENU ITEM CARD ── */
  .menu-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 10px;
    display: flex;
    overflow: hidden;
    position: relative;
    transition: border-color 0.2s;
  }
  .menu-card:active { border-color: var(--gold); }
  .menu-card.unavailable { opacity: 0.55; }

  /* Photo */
  .card-photo {
    width: 90px;
    min-height: 90px;
    flex-shrink: 0;
    background: #2a1e08;
    position: relative;
    overflow: hidden;
  }
  .card-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-photo .photo-placeholder {
    width: 100%; height: 100%;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }

  /* Info */
  .card-info {
    flex: 1;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 90px;
  }
  .card-top { flex: 1; }
  .card-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--cream);
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .card-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }
  .card-price {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.01em;
  }
  .card-price span { font-size: 11px; font-weight: 500; color: var(--muted); }

  .avail-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 1px;
  }
  .avail-yes { background: rgba(46,139,58,0.2); color: #4eca60; }
  .avail-no  { background: rgba(200,16,46,0.2); color: #e04060; }

  /* Sold-out ribbon */
  .sold-out-ribbon {
    position: absolute;
    top: 8px; right: -18px;
    background: var(--red);
    color: #fff;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 22px;
    transform: rotate(35deg);
    transform-origin: center;
  }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    padding: 32px 20px 20px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.8;
  }
  .footer .momo {
    display: inline-block;
    background: #1c1408;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 20px;
    margin: 12px 0;
    font-size: 13px;
    color: var(--cream);
  }
  .footer .momo strong { color: var(--gold); display: block; font-size: 16px; letter-spacing: 0.06em; }
  .footer .momo small { font-size: 10px; color: var(--muted); }

  .last-updated {
    font-size: 10px;
    color: #3a2e18;
    margin-top: 16px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<div class="header">
  <div class="logo-ring">
    <!-- Replace the src below with your actual logo URL after hosting -->
    <img src="https://i.imgur.com/placeholder.png"
         onerror="this.style.display='none';this.parentElement.innerHTML='🍽️';"
         alt="Tabitha's Logo">
  </div>
  <div class="brand-name">Tabitha's Restaurant</div>
  <div class="brand-sub">Dome Branch · Accra</div>
  <div class="brand-estd">ESTD · 2018 &nbsp;|&nbsp; 🇨🇮 Ivorian Kitchen in 🇬🇭 Ghana</div>
</div>

<!-- ══ NOTICE ══ -->
<div class="notice-banner">
  ⚠️ Sides are only available when ordered with a Main item. &nbsp;|&nbsp; Mains can be ordered alone.
</div>

<!-- ══ MENU CONTENT ══ -->
<div id="menu-root">
  <div class="status-box">
    <div class="spinner"></div>
    Loading menu…
  </div>
</div>

<!-- ══ FOOTER ══ -->
<div class="footer">
  <div>Pay with MTN MoMo</div>
  <div class="momo">
    📱 <strong>0591 355 392</strong>
    <small>Account Name: Amanda Okyere</small>
  </div>
  <div>Thank you for choosing Tabitha's Restaurant 🙏</div>
  <div class="last-updated" id="last-updated"></div>
</div>

<script>
// ════════════════════════════════════════════════════════
// CONFIGURATION — Replace SHEET_ID with your Google Sheet ID
// ════════════════════════════════════════════════════════
const SHEET_ID = '1W_F6ELdBiv7_kljcJ6zRU0UcIQBjx_C64PL4tR1j4MY';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

// Category display config
const CATEGORY_CONFIG = {
  'mains':    { label: 'Mains',    icon: '🍗', order: 1 },
  'sides':    { label: 'Sides',    icon: '🍟', order: 2 },
  'drinks':   { label: 'Drinks',   icon: '🥤', order: 3 },
  'specials': { label: 'Specials', icon: '⭐', order: 4 },
};

// Food emoji fallback per category
const FALLBACK_EMOJI = {
  'mains':    '🍗',
  'sides':    '🍟',
  'drinks':   '🥤',
  'specials': '⭐',
};

// ════════════════════════════════════════════════════════
// CSV PARSER
// ════════════════════════════════════════════════════════
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,'').toLowerCase());
  return lines.slice(1).map(line => {
    // Handle quoted fields with commas
    const fields = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQuotes = !inQuotes; }
      else if (line[i] === ',' && !inQuotes) { fields.push(current.trim()); current = ''; }
      else { current += line[i]; }
    }
    fields.push(current.trim());
    const row = {};
    headers.forEach((h, i) => { row[h] = (fields[i] || '').replace(/^"|"$/g,'').trim(); });
    return row;
  }).filter(row => row.name && row.name.length > 0);
}

// ════════════════════════════════════════════════════════
// RENDER MENU
// ════════════════════════════════════════════════════════
function renderMenu(items) {
  const root = document.getElementById('menu-root');

  // Group by category
  const groups = {};
  items.forEach(item => {
    const cat = (item.category || 'mains').toLowerCase().trim();
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(item);
  });

  // Sort categories
  const sortedCats = Object.keys(groups).sort((a, b) => {
    const orderA = CATEGORY_CONFIG[a]?.order ?? 99;
    const orderB = CATEGORY_CONFIG[b]?.order ?? 99;
    return orderA - orderB;
  });

  let html = '';
  sortedCats.forEach(cat => {
    const config = CATEGORY_CONFIG[cat] || { label: cat, icon: '🍴' };
    const catItems = groups[cat];
    const available = catItems.filter(i => i.available?.toLowerCase() !== 'no').length;

    html += `<div class="category-section">
      <div class="category-header">
        <span class="category-icon">${config.icon}</span>
        <span class="category-name">${config.label}</span>
        <span class="category-count">${available}/${catItems.length} available</span>
      </div>`;

    catItems.forEach(item => {
      const isAvailable = item.available?.toLowerCase() !== 'no';
      const hasPhoto = item.photo_url && item.photo_url.length > 5;
      const emoji = FALLBACK_EMOJI[cat] || '🍴';

      html += `<div class="menu-card ${isAvailable ? '' : 'unavailable'}">
        <div class="card-photo">
          ${hasPhoto
            ? `<img src="${item.photo_url}" alt="${item.name}"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
               <div class="photo-placeholder" style="display:none">${emoji}</div>`
            : `<div class="photo-placeholder">${emoji}</div>`
          }
        </div>
        <div class="card-info">
          <div class="card-top">
            <div class="card-name">${item.name}</div>
            ${item.description ? `<div class="card-desc">${item.description}</div>` : ''}
          </div>
          <div class="card-bottom">
            <div class="card-price">${item.price} <span>GHS</span></div>
            <span class="avail-badge ${isAvailable ? 'avail-yes' : 'avail-no'}">
              ${isAvailable ? '✓ Available' : '✗ Sold Out'}
            </span>
          </div>
        </div>
        ${!isAvailable ? '<div class="sold-out-ribbon">Sold Out</div>' : ''}
      </div>`;
    });

    html += `</div>`;
  });

  root.innerHTML = html;
  document.getElementById('last-updated').textContent =
    `Last updated: ${new Date().toLocaleString('en-GH', {dateStyle:'medium', timeStyle:'short'})}`;
}

// ════════════════════════════════════════════════════════
// FETCH FROM GOOGLE SHEETS
// ════════════════════════════════════════════════════════
async function loadMenu() {
  const root = document.getElementById('menu-root');

  // Demo mode — show sample data if Sheet ID not yet configured
  if (SHEET_ID === 'YOUR_GOOGLE_SHEET_ID_HERE') {
    renderMenu(DEMO_DATA);
    document.getElementById('last-updated').textContent =
      '⚠️ Demo mode — connect your Google Sheet to show live data';
    return;
  }

  try {
    const response = await fetch(SHEET_URL);
    if (!response.ok) throw new Error('Sheet not reachable');
    const text = await response.text();
    const items = parseCSV(text);
    if (items.length === 0) throw new Error('No items found');
    renderMenu(items);
  } catch (err) {
    root.innerHTML = `<div class="status-box">
      ⚠️ Could not load menu.<br>
      <small style="color:#5a4020;margin-top:8px;display:block">
        Make sure the Google Sheet is published to web.<br>(${err.message})
      </small>
    </div>`;
  }
}

// ════════════════════════════════════════════════════════
// DEMO DATA — shown until Sheet ID is connected
// ════════════════════════════════════════════════════════
const DEMO_DATA = [
  // MAINS
  { category:'mains', name:'1 Roasted Chicken Drumstick',   description:'Tender juicy drumstick, roasted to perfection',    price:'25',  available:'yes', photo_url:'' },
  { category:'mains', name:'2 Roasted Chicken Drumsticks',  description:'Double drumsticks — great value',                  price:'45',  available:'yes', photo_url:'' },
  { category:'mains', name:'Roasted Chicken Thigh',         description:'Succulent chicken thigh, smoky & well-seasoned',   price:'55',  available:'yes', photo_url:'' },
  { category:'mains', name:'Fried Full Tilapia',            description:'Whole tilapia, crispy-fried, West African style',  price:'65',  available:'yes', photo_url:'' },
  { category:'mains', name:'1 Fried Tuna Piece (Garba)',    description:'Classic Ivorian Garba — one tuna piece',           price:'35',  available:'yes', photo_url:'' },
  { category:'mains', name:'2 Fried Tuna Pieces (Garba)',   description:'Double tuna pieces — the real Garba experience',   price:'65',  available:'yes', photo_url:'' },
  // SIDES
  { category:'sides', name:'Fried Plantain (Alloco)',       description:'Sweet ripe plantain, golden-fried Ivorian style',  price:'20',  available:'yes', photo_url:'' },
  { category:'sides', name:'Acheke',                        description:'Fermented cassava couscous — authentic Ivorian',   price:'15',  available:'yes', photo_url:'' },
  { category:'sides', name:'Jollof Rice',                   description:'Flavourful West African Jollof rice',              price:'20',  available:'yes', photo_url:'' },
  // DRINKS
  { category:'drinks', name:'Sobolo (500ml)',               description:'Hibiscus drink — chilled & refreshing',            price:'10',  available:'yes', photo_url:'' },
  { category:'drinks', name:'Mango Juice Dafani (1L)',      description:'Premium Dafani mango juice, 1 litre',              price:'50',  available:'yes', photo_url:'' },
  { category:'drinks', name:'Mineral Water (500ml)',        description:'Chilled bottled water',                            price:'5',   available:'yes', photo_url:'' },
  // SPECIALS
  { category:'specials', name:'Fried Eggs',                 description:'Freshly fried eggs',                               price:'20',  available:'yes', photo_url:'' },
  { category:'specials', name:'Veggies Mix',                description:'Onion, tomatoes, pepper & garlic mix',             price:'10',  available:'yes', photo_url:'' },
];

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
loadMenu();
</script>
</body>
</html>
