<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tabitha's — Staff Order Entry</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:   #C8860A;
    --amber:  #E6A020;
    --dark:   #0E0900;
    --card:   #1A1206;
    --border: #2A1E08;
    --cream:  #F5EDD8;
    --muted:  #7A6040;
    --red:    #C8102E;
    --green:  #2E8B3A;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--dark); color:var(--cream); font-family:'DM Sans',sans-serif; min-height:100vh; padding-bottom:100px; }

  /* ── LOGIN ── */
  .login-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; }
  .login-icon  { font-size:56px; margin-bottom:16px; }
  .login-title { font-family:'Playfair Display',serif; font-size:24px; color:var(--cream); margin-bottom:6px; }
  .login-sub   { font-size:13px; color:var(--muted); margin-bottom:32px; }
  .pin-input { width:100%; max-width:260px; background:var(--card); border:1px solid var(--border); border-radius:3px; color:var(--cream); font-size:28px; letter-spacing:0.3em; padding:16px; text-align:center; font-family:'DM Sans',sans-serif; outline:none; margin-bottom:16px; transition:border-color 0.2s; }
  .pin-input:focus { border-color:var(--gold); }
  .pin-btn { width:100%; max-width:260px; background:var(--gold); color:var(--dark); border:none; border-radius:3px; font-size:15px; font-weight:800; padding:16px; cursor:pointer; font-family:'DM Sans',sans-serif; letter-spacing:0.06em; text-transform:uppercase; }
  .pin-btn:active { background:var(--amber); }
  .pin-error { font-size:13px; color:#e04060; margin-top:12px; display:none; }

  /* ── HEADER ── */
  .header { background:linear-gradient(180deg,#1a0f00 0%,var(--dark) 100%); padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .header-title { font-family:'Playfair Display',serif; font-size:18px; color:var(--cream); }
  .header-sub { font-size:10px; color:var(--muted); margin-top:2px; }
  .lock-btn { background:transparent; border:1px solid var(--border); color:var(--muted); font-size:12px; padding:7px 12px; border-radius:2px; cursor:pointer; font-family:'DM Sans',sans-serif; }

  /* ── NAV ── */
  .nav-links { display:flex; gap:12px; padding:10px 16px; background:#110b00; border-bottom:1px solid var(--border); }
  .nav-links a { font-size:11px; color:var(--muted); text-decoration:none; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; padding:6px 10px; border-radius:2px; transition:color 0.2s; }
  .nav-links a.active { color:var(--gold); }

  /* ── LOADING ── */
  .loading-box { text-align:center; padding:60px 24px; color:var(--muted); }
  .spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── MENU ITEMS ── */
  .section-title { padding:16px 16px 8px; font-family:'Playfair Display',serif; font-size:17px; color:var(--cream); display:flex; align-items:center; gap:8px; }
  .menu-grid { padding:0 16px; display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .menu-item-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.2s;
  }
  .menu-item-row.in-cart { border-color: var(--gold); background: rgba(200,134,10,0.06); }
  .item-left { flex:1; }
  .item-name  { font-size:14px; font-weight:700; color:var(--cream); }
  .item-price { font-size:13px; color:var(--gold); margin-top:2px; }
  .item-unavail { font-size:11px; color:var(--muted); margin-top:2px; }

  .qty-control { display:flex; align-items:center; gap:0; background:var(--border); border-radius:2px; overflow:hidden; }
  .qty-btn { background:transparent; border:none; color:var(--cream); font-size:18px; font-weight:700; width:34px; height:32px; cursor:pointer; line-height:1; font-family:'DM Sans',sans-serif; }
  .qty-btn:active { background:rgba(255,255,255,0.08); }
  .qty-num { font-size:14px; font-weight:800; color:var(--gold); min-width:26px; text-align:center; }

  .add-btn { background:var(--gold); color:var(--dark); border:none; border-radius:2px; font-size:12px; font-weight:800; padding:8px 16px; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .add-btn:active { background:var(--amber); }

  /* ── CART BAR ── */
  .cart-bar { position:fixed; bottom:20px; left:16px; right:16px; background:var(--gold); color:var(--dark); border-radius:3px; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; box-shadow:0 8px 32px rgba(0,0,0,0.6); z-index:90; transform:translateY(120px); transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
  .cart-bar.visible { transform:translateY(0); }
  .cart-bar-left { display:flex; align-items:center; gap:10px; }
  .cart-count-badge { background:var(--dark); color:var(--gold); font-size:11px; font-weight:800; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .cart-bar-label { font-size:14px; font-weight:700; }
  .cart-bar-total { font-size:15px; font-weight:800; }

  /* ── FORM SHEET ── */
  .sheet-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; }
  .sheet-overlay.open { display:block; }
  .bottom-sheet { position:fixed; left:0; right:0; bottom:0; background:#140e02; border-top:2px solid var(--gold); border-radius:12px 12px 0 0; z-index:101; max-height:94vh; overflow-y:auto; transform:translateY(100%); transition:transform 0.35s cubic-bezier(0.32,0.72,0,1); padding-bottom:env(safe-area-inset-bottom,16px); }
  .bottom-sheet.open { transform:translateY(0); }
  .sheet-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:12px auto 0; }
  .sheet-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; border-bottom:1px solid var(--border); }
  .sheet-title { font-family:'Playfair Display',serif; font-size:20px; color:var(--cream); }
  .sheet-close { background:transparent; border:1px solid var(--border); color:var(--muted); width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  .form-body { padding:0 20px 24px; }
  .form-group { margin-bottom:18px; }
  .form-label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:8px; display:block; }
  .form-input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:3px; color:var(--cream); font-size:15px; padding:14px 16px; font-family:'DM Sans',sans-serif; outline:none; transition:border-color 0.2s; }
  .form-input:focus { border-color:var(--gold); }
  .form-input::placeholder { color:var(--muted); }

  .type-grid { display:flex; flex-direction:column; gap:10px; }
  .type-tile { background:var(--card); border:1px solid var(--border); border-radius:3px; padding:12px 14px; cursor:pointer; transition:border-color 0.2s; display:flex; align-items:center; gap:12px; }
  .type-tile.selected { border-color:var(--gold); background:rgba(200,134,10,0.07); }
  .type-tile-icon { font-size:20px; }
  .type-tile-text .type-tile-title { font-size:14px; font-weight:700; color:var(--cream); }
  .type-tile-text .type-tile-desc  { font-size:11px; color:var(--muted); margin-top:2px; }

  /* Cart items in form */
  .order-summary-box { background:var(--card); border:1px solid var(--border); border-radius:3px; padding:12px 14px; margin-bottom:18px; }
  .order-summary-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .order-summary-row:last-child { margin-bottom:0; border-top:1px solid var(--border); padding-top:8px; margin-top:4px; }
  .order-summary-name { color:var(--cream); }
  .order-summary-price { color:var(--gold); font-weight:700; }

  .submit-btn { width:100%; background:var(--gold); color:var(--dark); border:none; border-radius:3px; font-size:16px; font-weight:800; padding:18px; cursor:pointer; font-family:'DM Sans',sans-serif; letter-spacing:0.04em; text-transform:uppercase; transition:background 0.15s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .submit-btn:active { background:var(--amber); }
  .submit-btn:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }
  .submit-btn .btn-spinner { width:18px; height:18px; border:3px solid rgba(0,0,0,0.2); border-top-color:var(--dark); border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
  .submit-btn.loading .btn-spinner { display:block; }
  .submit-btn.loading .btn-text { display:none; }

  .form-error { display:none; background:rgba(200,16,46,0.12); border:1px solid rgba(200,16,46,0.3); border-radius:3px; padding:12px 14px; font-size:13px; color:#e04060; margin-bottom:16px; }

  /* ── SUCCESS SCREEN ── */
  .success-screen { display:none; position:fixed; inset:0; background:var(--dark); z-index:200; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; }
  .success-screen.open { display:flex; }
  .success-icon { font-size:64px; margin-bottom:16px; }
  .success-title { font-family:'Playfair Display',serif; font-size:26px; color:var(--cream); margin-bottom:8px; }
  .success-sub { font-size:13px; color:var(--muted); margin-bottom:24px; }
  .order-id-box { background:var(--card); border:1px solid var(--gold); border-radius:4px; padding:16px 28px; margin-bottom:28px; }
  .order-id-label { font-size:10px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .order-id-value { font-family:'Playfair Display',serif; font-size:30px; color:var(--gold); letter-spacing:0.06em; }
  .new-order-btn { background:var(--gold); color:var(--dark); border:none; border-radius:3px; font-size:15px; font-weight:800; padding:16px 32px; cursor:pointer; font-family:'DM Sans',sans-serif; letter-spacing:0.04em; text-transform:uppercase; }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen" class="login-screen">
  <div class="login-icon">👨‍🍳</div>
  <div class="login-title">Staff Entry</div>
  <div class="login-sub">Enter your staff PIN to place orders</div>
  <input class="pin-input" type="password" id="pin-input" maxlength="6" placeholder="••••" inputmode="numeric">
  <button class="pin-btn" onclick="doLogin()">Enter</button>
  <div class="pin-error" id="pin-error">Invalid PIN — please try again</div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="main-app" style="display:none;">

  <div class="header">
    <div>
      <div class="header-title">Staff Order Entry</div>
      <div class="header-sub">Tabitha's Restaurant — Dome</div>
    </div>
    <button class="lock-btn" onclick="doLogout()">🔒 Lock</button>
  </div>

  <div class="nav-links">
    <a href="index.html">Customer Menu</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="staff.html" class="active">Staff Entry</a>
  </div>

  <!-- MENU LOADING -->
  <div id="loading-state" class="loading-box">
    <div class="spinner"></div>
    Loading menu…
  </div>

  <!-- MENU -->
  <div id="menu-root" style="display:none;"></div>

</div>

<!-- ══ CART BAR ══ -->
<div class="cart-bar" id="cart-bar" onclick="openForm()">
  <div class="cart-bar-left">
    <div class="cart-count-badge" id="cart-count">0</div>
    <span class="cart-bar-label">Place Order</span>
  </div>
  <div class="cart-bar-total" id="cart-bar-total">GHS 0</div>
</div>

<!-- ══ ORDER FORM SHEET ══ -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeForm()"></div>
<div class="bottom-sheet" id="order-form-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Order Details</div>
    <button class="sheet-close" onclick="closeForm()">✕</button>
  </div>
  <div class="form-body">

    <div id="order-summary-box" class="order-summary-box"></div>

    <div class="form-group">
      <label class="form-label">Customer Name *</label>
      <input class="form-input" type="text" id="input-name" placeholder="Customer name">
    </div>
    <div class="form-group">
      <label class="form-label">Customer Phone *</label>
      <input class="form-input" type="tel" id="input-phone" placeholder="Phone number">
    </div>

    <div class="form-group">
      <label class="form-label">Order Type *</label>
      <div class="type-grid">
        <label class="type-tile" id="tile-dine_in" onclick="selectType('dine_in')">
          <div class="type-tile-icon">🍽️</div>
          <div class="type-tile-text">
            <div class="type-tile-title">Dine-in</div>
            <div class="type-tile-desc">Customer eating at the restaurant</div>
          </div>
        </label>
        <label class="type-tile" id="tile-takeaway" onclick="selectType('takeaway')">
          <div class="type-tile-icon">🥡</div>
          <div class="type-tile-text">
            <div class="type-tile-title">Takeaway / Pick-up</div>
            <div class="type-tile-desc">Customer collecting their order</div>
          </div>
        </label>
        <label class="type-tile" id="tile-delivery_pay_now" onclick="selectType('delivery_pay_now')">
          <div class="type-tile-icon">🛵</div>
          <div class="type-tile-text">
            <div class="type-tile-title">Delivery — Prepaid</div>
            <div class="type-tile-desc">Customer paid MoMo before dispatch</div>
          </div>
        </label>
        <label class="type-tile" id="tile-delivery_pay_collection" onclick="selectType('delivery_pay_collection')">
          <div class="type-tile-icon">💵</div>
          <div class="type-tile-text">
            <div class="type-tile-title">Delivery — Pay on Collection</div>
            <div class="type-tile-desc">Customer pays rider on arrival</div>
          </div>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Payment Method *</label>
      <div class="type-grid">
        <label class="type-tile" id="tile-pay-MoMo" onclick="selectPay('MoMo')">
          <div class="type-tile-icon">📱</div>
          <div class="type-tile-text">
            <div class="type-tile-title">MoMo</div>
          </div>
        </label>
        <label class="type-tile" id="tile-pay-Cash" onclick="selectPay('Cash')">
          <div class="type-tile-icon">💵</div>
          <div class="type-tile-text">
            <div class="type-tile-title">Cash</div>
          </div>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Notes (optional)</label>
      <input class="form-input" type="text" id="input-notes" placeholder="Special requests, allergies…">
    </div>

    <div class="form-error" id="form-error"></div>

    <button class="submit-btn" id="submit-btn" onclick="submitOrder()">
      <div class="btn-spinner"></div>
      <span class="btn-text">✅ Confirm & Place Order</span>
    </button>
  </div>
</div>

<!-- ══ SUCCESS ══ -->
<div class="success-screen" id="success-screen">
  <div class="success-icon">✅</div>
  <div class="success-title">Order Placed!</div>
  <div class="success-sub" id="success-sub">Order confirmed and sent to kitchen.</div>
  <div class="order-id-box">
    <div class="order-id-label">Order ID</div>
    <div class="order-id-value" id="success-order-id">—</div>
  </div>
  <button class="new-order-btn" onclick="resetForNewOrder()">+ New Order</button>
</div>

<script>
const SHEET_ID = '1W_F6ELdBiv7_kljcJ6zRU0UcIQBjx_C64PL4tR1j4MY';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
const API_URL   = 'https://script.google.com/macros/s/AKfycbwL21yH5n8XV97JTuNHGCqDEB01zoSyDZQO_YUYUb42Mm-DW9KR1apzyjV5S7kUEX0P/exec';
const PIN_KEY   = 'tabitha_staff_pin';

let staffPin = '';
let menuItems = [];
let cart = {};
let selectedType = null;
let selectedPay  = null;

const CATEGORY_CONFIG = {
  'mains':    { label:'Mains',    icon:'🍗', order:1 },
  'sides':    { label:'Sides',    icon:'🍟', order:2 },
  'drinks':   { label:'Drinks',   icon:'🥤', order:3 },
  'specials': { label:'Specials', icon:'⭐', order:4 },
};

// ════════ LOGIN ════════
function doLogin() {
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;
  // Verify with a real API call
  fetch(`${API_URL}?action=dashboard&pin=${encodeURIComponent(pin)}`)
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        staffPin = pin;
        sessionStorage.setItem(PIN_KEY, pin);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        loadMenu();
      } else {
        document.getElementById('pin-error').style.display = 'block';
        document.getElementById('pin-input').value = '';
      }
    })
    .catch(() => {
      document.getElementById('pin-error').textContent = 'Connection error. Try again.';
      document.getElementById('pin-error').style.display = 'block';
    });
}

function doLogout() {
  sessionStorage.removeItem(PIN_KEY);
  staffPin = '';
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-error').style.display = 'none';
}

window.addEventListener('load', () => {
  const saved = sessionStorage.getItem(PIN_KEY);
  if (saved) {
    staffPin = saved;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    loadMenu();
  }
});

document.getElementById('pin-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ════════ MENU ════════
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,'').toLowerCase());
  return lines.slice(1).map(line => {
    const fields = []; let cur = '', inQ = false;
    for (let c of line) {
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { fields.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    fields.push(cur.trim());
    const row = {};
    headers.forEach((h,i) => { row[h] = (fields[i]||'').replace(/^"|"$/g,'').trim(); });
    return row;
  }).filter(r => r.name);
}

async function loadMenu() {
  try {
    const res = await fetch(SHEET_URL + '&t=' + Date.now());
    menuItems = parseCSV(await res.text());
    renderMenu();
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('menu-root').style.display = 'block';
  } catch(e) {
    document.getElementById('loading-state').innerHTML = `<div style="text-align:center;padding:60px 24px;color:var(--muted);">⚠️ Menu failed to load<br><br><button onclick="loadMenu()" style="background:var(--gold);color:var(--dark);border:none;padding:10px 20px;border-radius:3px;font-weight:700;cursor:pointer;">Retry</button></div>`;
  }
}

function renderMenu() {
  const groups = {};
  menuItems.forEach(item => {
    const cat = (item.category||'mains').toLowerCase();
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(item);
  });
  const cats = Object.keys(groups).sort((a,b) => (CATEGORY_CONFIG[a]?.order||99)-(CATEGORY_CONFIG[b]?.order||99));
  let html = '';
  cats.forEach(cat => {
    const cfg = CATEGORY_CONFIG[cat] || { label:cat, icon:'🍴' };
    html += `<div class="section-title">${cfg.icon} ${cfg.label}</div><div class="menu-grid">`;
    groups[cat].forEach(item => {
      const isAvail = item.available?.toLowerCase() !== 'no';
      const qty = cart[item.name]?.qty || 0;
      const price = parseFloat(item.price) || 0;
      html += `<div class="menu-item-row ${qty>0?'in-cart':''}" id="row-${CSS.escape(item.name)}">
        <div class="item-left">
          <div class="item-name">${item.name}</div>
          <div class="item-price">GHS ${price}</div>
          ${!isAvail ? '<div class="item-unavail">Unavailable</div>' : ''}
        </div>
        ${isAvail
          ? (qty > 0
            ? `<div class="qty-control">
                 <button class="qty-btn" onclick="chg('${escJ(item.name)}',${price},-1)">−</button>
                 <span class="qty-num">${qty}</span>
                 <button class="qty-btn" onclick="chg('${escJ(item.name)}',${price},+1)">+</button>
               </div>`
            : `<button class="add-btn" onclick="chg('${escJ(item.name)}',${price},+1)">Add</button>`)
          : ''}
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('menu-root').innerHTML = html;
}

function escJ(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function chg(name, price, delta) {
  const cur = cart[name]?.qty || 0;
  const nq = cur + delta;
  if (nq <= 0) delete cart[name];
  else cart[name] = { name, price, qty: nq };
  updateCartBar();
  // Re-render just that row
  const row = document.getElementById('row-' + CSS.escape(name));
  if (!row) return;
  const qty = cart[name]?.qty || 0;
  row.classList.toggle('in-cart', qty > 0);
  const right = qty > 0
    ? `<div class="qty-control"><button class="qty-btn" onclick="chg('${escJ(name)}',${price},-1)">−</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="chg('${escJ(name)}',${price},+1)">+</button></div>`
    : `<button class="add-btn" onclick="chg('${escJ(name)}',${price},+1)">Add</button>`;
  const left = row.querySelector('.item-left');
  row.innerHTML = '';
  row.appendChild(left);
  row.insertAdjacentHTML('beforeend', right);
}

function cartTotal() { return Object.values(cart).reduce((s,i)=>s+i.price*i.qty,0); }
function cartCount() { return Object.values(cart).reduce((s,i)=>s+i.qty,0); }

function updateCartBar() {
  const count = cartCount();
  const total = cartTotal();
  document.getElementById('cart-count').textContent = count;
  document.getElementById('cart-bar-total').textContent = 'GHS ' + total;
  document.getElementById('cart-bar').classList.toggle('visible', count > 0);
}

// ════════ FORM ════════
function openForm() {
  if (cartCount() === 0) return;
  renderOrderSummary();
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('order-form-sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeForm() {
  document.getElementById('sheet-overlay').classList.remove('open');
  document.getElementById('order-form-sheet').classList.remove('open');
  document.body.style.overflow = '';
}

function renderOrderSummary() {
  const items = Object.values(cart);
  let html = items.map(i => `<div class="order-summary-row">
    <span class="order-summary-name">${i.qty}× ${i.name}</span>
    <span class="order-summary-price">GHS ${i.price*i.qty}</span>
  </div>`).join('');
  html += `<div class="order-summary-row">
    <span style="font-size:13px;font-weight:700;color:var(--cream);">TOTAL</span>
    <span class="order-summary-price" style="font-size:16px;">GHS ${cartTotal()}</span>
  </div>`;
  document.getElementById('order-summary-box').innerHTML = html;
}

function selectType(type) {
  selectedType = type;
  ['dine_in','takeaway','delivery_pay_now','delivery_pay_collection'].forEach(t => {
    document.getElementById('tile-'+t).classList.toggle('selected', t===type);
  });
}

function selectPay(pay) {
  selectedPay = pay;
  ['MoMo','Cash'].forEach(p => {
    document.getElementById('tile-pay-'+p).classList.toggle('selected', p===pay);
  });
}

async function submitOrder() {
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('form-error');
  errEl.style.display = 'none';

  const name  = document.getElementById('input-name').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  const notes = document.getElementById('input-notes').value.trim();

  if (!name) { showErr('Enter customer name.'); return; }
  if (!phone || phone.length < 9) { showErr('Enter a valid phone number.'); return; }
  if (!selectedType) { showErr('Select an order type.'); return; }
  if (!selectedPay)  { showErr('Select a payment method.'); return; }
  if (cartCount() === 0) { showErr('Cart is empty.'); return; }

  btn.classList.add('loading');
  btn.disabled = true;

  const items = Object.values(cart).map(i => ({ name:i.name, qty:i.qty, price:i.price }));
  const params = new URLSearchParams({
    action:        'place_order',
    customerName:  name,
    phone:         phone,
    orderType:     selectedType,
    paymentMethod: selectedPay,
    items:         encodeURIComponent(JSON.stringify(items)),
    total:         cartTotal(),
    enteredBy:     'Staff',
    notes:         notes
  });

  try {
    const res = await fetch(`${API_URL}?${params}`);
    const data = await res.json();
    if (data.success) {
      closeForm();
      showSuccess(data.orderId, data.status);
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch(err) {
    showErr('Failed: ' + err.message);
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function showErr(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function showSuccess(orderId, status) {
  document.getElementById('success-order-id').textContent = orderId;
  document.getElementById('success-sub').textContent = status === 'CONFIRMED'
    ? 'Order confirmed and sent to kitchen.'
    : 'Order received — awaiting payment verification.';
  document.getElementById('success-screen').classList.add('open');
}

function resetForNewOrder() {
  cart = {};
  selectedType = null;
  selectedPay  = null;
  document.getElementById('input-name').value = '';
  document.getElementById('input-phone').value = '';
  document.getElementById('input-notes').value = '';
  document.getElementById('success-screen').classList.remove('open');
  document.getElementById('submit-btn').classList.remove('loading');
  document.getElementById('submit-btn').disabled = false;
  ['dine_in','takeaway','delivery_pay_now','delivery_pay_collection'].forEach(t => {
    document.getElementById('tile-'+t).classList.remove('selected');
  });
  ['MoMo','Cash'].forEach(p => { document.getElementById('tile-pay-'+p).classList.remove('selected'); });
  updateCartBar();
  renderMenu();
}
</script>
</body>
</html>
