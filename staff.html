<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tabitha's — Staff Entry</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --gold: #C8860A; --dark: #0E0900; --card: #1A1206; --border: #2A1E08; --cream: #F5EDD8; --muted: #7A6040; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--dark); color:var(--cream); font-family:'DM Sans',sans-serif; min-height:100vh; padding: 20px; text-align: center; }
  .pin-input { width:100%; max-width:260px; background:var(--card); border:1px solid var(--border); color:var(--cream); font-size:28px; letter-spacing:0.3em; padding:16px; text-align:center; outline:none; margin: 20px auto; display: block; }
  .pin-btn { width:100%; max-width:260px; background:var(--gold); color:var(--dark); border:none; font-size:15px; font-weight:800; padding:16px; cursor:pointer; text-transform:uppercase; }
  .nav-links { display:flex; justify-content:center; gap:12px; margin-bottom: 20px; }
  .nav-links a { color: var(--muted); text-decoration: none; text-transform: uppercase; font-size: 11px; }
  .nav-links a.active { color: var(--gold); }
</style>
</head>
<body>
<div class="nav-links">
  <a href="index.html">Customer Menu</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="staff.html" class="active">Staff Entry</a>
</div>

<div id="login-screen">
  <h2>Staff Entry PIN</h2>
  <input class="pin-input" type="password" id="pin-input" maxlength="4" placeholder="••••" oninput="if(this.value.length===4) doLogin()">
  <br>
  <button class="pin-btn" onclick="doLogin()">Enter</button>
</div>

<div id="main-app" style="display:none;">
  <h2>Staff Mode Active</h2>
  <p style="color:var(--muted); margin-top:10px;">Use the Customer Menu or Dashboard for order processing.</p>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwzB2lDGwBGb8oC_C3_WDH9JPFdOsQl-g3pYdlWIrQIqfXcJCAy-fmsrB3OLv5zV6fuQw/exec';
function doLogin() {
  const pin = document.getElementById('pin-input').value.trim();
  fetch(`${API_URL}?action=dashboard&pin=${encodeURIComponent(pin)}`).then(r => r.json()).then(d => {
    if (d.success) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
    } else { alert('Invalid PIN'); }
  });
}
</script>
</body>
</html>
