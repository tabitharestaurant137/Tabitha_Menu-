<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tabitha's — Track Your Order</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:   #C8860A; --amber:  #E6A020; --dark:   #0E0900;
    --card:   #1A1206; --border: #2A1E08; --cream:  #F5EDD8; --muted:  #7A6040;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--dark); color:var(--cream); font-family:'DM Sans',sans-serif; min-height:100vh; }
  .header { background:linear-gradient(180deg,#1a0f00 0%,var(--dark) 100%); padding:28px 20px 20px; text-align:center; border-bottom:1px solid var(--border); }
  .brand-name { font-family:'Playfair Display',serif; font-size:22px; color:var(--cream); }
  .brand-sub  { font-size:10px; font-weight:700; letter-spacing:0.24em; text-transform:uppercase; color:var(--gold); margin-top:4px; }
  .nav-links { display:flex; justify-content:center; gap:12px; padding:10px 16px; background:#110b00; border-bottom:1px solid var(--border); }
  .nav-links a { font-size:11px; color:var(--muted); text-decoration:none; text-transform:uppercase; font-weight:600; padding:6px 10px; }
  .nav-links a.active { color:var(--gold); }
  .search-section { padding:28px 20px 20px; text-align: center; }
  .search-input { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 3px; color: var(--cream); font-size: 16px; padding: 16px; outline: none; text-align: center; text-transform: uppercase; margin-bottom: 14px; }
  .search-btn { width: 100%; max-width: 400px; background: var(--gold); color: var(--dark); border: none; font-size: 15px; font-weight: 800; padding: 16px; cursor: pointer; text-transform: uppercase; }
  .result-card { background:var(--card); border:1px solid var(--border); max-width: 500px; margin: 0 auto 30px; border-radius:4px; display:none; }
  .result-card.visible { display:block; }
  .status-stripe { padding:16px 20px; display:flex; align-items:center; gap:14px; }
  .result-body { padding:16px 20px; }
  .detail-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .footer { text-align:center; padding:32px 20px; font-size:11px; color:var(--muted); }
  .footer a { color:var(--gold); text-decoration:none; }
</style>
</head>
<body>

<div class="header">
  <div class="brand-name">Tabitha's Restaurant</div>
  <div class="brand-sub">Order Tracker</div>
</div>

<div class="nav-links">
  <a href="index.html">Order</a>
  <a href="track.html" class="active">Track Order</a>
  <a href="staff.html">Staff</a>
</div>

<div class="search-section">
  <h2 style="font-family:'Playfair Display',serif; margin-bottom:6px;">Track Your Order</h2>
  <p style="font-size:13px; color:var(--muted); margin-bottom:20px;">Enter your Order ID to see real-time status</p>
  <input class="search-input" type="text" id="order-id-input" placeholder="e.g. TAB-1012-0001">
  <br>
  <button class="search-btn" onclick="doSearch()">🔍 Track Order</button>
</div>

<div class="result-card" id="result-card">
  <div class="status-stripe" id="status-stripe">
    <div style="font-size:36px;" id="status-icon">⏳</div>
    <div>
      <div style="font-size:11px; font-weight:700; text-transform:uppercase;" id="status-label">Status</div>
      <div style="font-family:'Playfair Display',serif; font-size:20px;" id="status-value">—</div>
    </div>
  </div>
  <div class="result-body">
    <div class="detail-row"><span>Order ID</span><span id="detail-id">—</span></div>
    <div class="detail-row"><span>Customer Name</span><span id="detail-name">—</span></div>
    <div class="detail-row"><span>Total Amount</span><span id="detail-total">GHS —</span></div>
  </div>
</div>

<div class="footer"><a href="index.html">← Place a new order</a></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwzB2lDGwBGb8oC_C3_WDH9JPFdOsQl-g3pYdlWIrQIqfXcJCAy-fmsrB3OLv5zV6fuQw/exec';

window.addEventListener('load', () => {
  const id = new URLSearchParams(window.location.search).get('id');
  if (id) { document.getElementById('order-id-input').value = id.toUpperCase(); doSearch(); }
});

async function doSearch() {
  const orderId = document.getElementById('order-id-input').value.trim().toUpperCase();
  if (!orderId) return;
  const res = await fetch(`${API_URL}?action=order_status&orderId=${encodeURIComponent(orderId)}`);
  const data = await res.json();
  if (data.success) {
    document.getElementById('status-value').textContent = data.status;
    document.getElementById('detail-id').textContent = data.orderId;
    document.getElementById('detail-name').textContent = data.name;
    document.getElementById('detail-total').textContent = 'GHS ' + data.total;
    document.getElementById('result-card').classList.add('visible');
  } else {
    alert('Order not found.');
  }
}
</script>
</body>
</html>
