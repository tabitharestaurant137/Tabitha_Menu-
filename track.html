<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tabitha's — Track Your Order</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:   #C8860A;
    --amber:  #E6A020;
    --dark:   #0E0900;
    --card:   #1A1206;
    --border: #2A1E08;
    --cream:  #F5EDD8;
    --muted:  #7A6040;
    --red:    #C8102E;
    --green:  #2E8B3A;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--dark); color:var(--cream); font-family:'DM Sans',sans-serif; min-height:100vh; }

  /* ── HEADER ── */
  .header { background:linear-gradient(180deg,#1a0f00 0%,var(--dark) 100%); padding:28px 20px 20px; text-align:center; border-bottom:1px solid var(--border); }
  .logo-ring { width:64px; height:64px; border-radius:50%; border:2px solid var(--gold); overflow:hidden; margin:0 auto 12px; box-shadow:0 0 20px rgba(200,134,10,0.3); background:#1a1008; display:flex; align-items:center; justify-content:center; font-size:28px; }
  .brand-name { font-family:'Playfair Display',serif; font-size:22px; color:var(--cream); }
  .brand-sub  { font-size:10px; font-weight:700; letter-spacing:0.24em; text-transform:uppercase; color:var(--gold); margin-top:4px; }

  /* ── NAV ── */
  .nav-links { display:flex; justify-content:center; gap:12px; padding:10px 16px; background:#110b00; border-bottom:1px solid var(--border); }
  .nav-links a { font-size:11px; color:var(--muted); text-decoration:none; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; padding:6px 10px; border-radius:2px; transition:color 0.2s; }
  .nav-links a.active { color:var(--gold); }

  /* ── SEARCH SECTION ── */
  .search-section { padding:28px 20px 20px; }
  .search-title { font-family:'Playfair Display',serif; font-size:22px; color:var(--cream); margin-bottom:6px; text-align:center; }
  .search-sub { font-size:13px; color:var(--muted); text-align:center; margin-bottom:24px; }
  .search-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--cream);
    font-size: 16px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    outline: none;
    text-align: center;
    transition: border-color 0.2s;
    margin-bottom: 14px;
  }
  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { text-transform: none; letter-spacing: 0; color:var(--muted); }
  .search-btn {
    width: 100%;
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 3px;
    font-size: 15px;
    font-weight: 800;
    padding: 16px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .search-btn:active { background: var(--amber); }
  .search-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .search-btn .btn-spinner { width:18px; height:18px; border:3px solid rgba(0,0,0,0.2); border-top-color:var(--dark); border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
  .search-btn.loading .btn-spinner { display:block; }
  .search-btn.loading .btn-text { display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── RESULT ── */
  .result-card { background:var(--card); border:1px solid var(--border); border-radius:4px; margin:0 20px; overflow:hidden; display:none; }
  .result-card.visible { display:block; }

  /* Status stripe */
  .status-stripe { padding:16px 20px; display:flex; align-items:center; gap:14px; }
  .status-icon { font-size:36px; }
  .status-text {}
  .status-label { font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:4px; }
  .status-value { font-family:'Playfair Display',serif; font-size:22px; color:var(--cream); }

  /* Color by status */
  .stripe-PENDING    { background:rgba(230,160,32,0.1); border-bottom:1px solid rgba(230,160,32,0.2); }
  .stripe-CONFIRMED  { background:rgba(200,134,10,0.1); border-bottom:1px solid rgba(200,134,10,0.2); }
  .stripe-PREPARING  { background:rgba(91,159,230,0.1); border-bottom:1px solid rgba(91,159,230,0.2); }
  .stripe-READY      { background:rgba(78,202,96,0.1);  border-bottom:1px solid rgba(78,202,96,0.2); }
  .stripe-ON_THE_WAY { background:rgba(168,85,247,0.1); border-bottom:1px solid rgba(168,85,247,0.2); }
  .stripe-DONE       { background:rgba(122,96,64,0.1);  border-bottom:1px solid rgba(122,96,64,0.2); }
  .stripe-CANCELLED  { background:rgba(200,16,46,0.1);  border-bottom:1px solid rgba(200,16,46,0.2); }

  .label-PENDING    { color:var(--amber); }
  .label-CONFIRMED  { color:var(--gold); }
  .label-PREPARING  { color:#5b9fe6; }
  .label-READY      { color:#4eca60; }
  .label-ON_THE_WAY { color:#a855f7; }
  .label-DONE       { color:var(--muted); }
  .label-CANCELLED  { color:#e04060; }

  /* Order details */
  .result-body { padding:16px 20px; }
  .detail-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .detail-row:last-child { border:none; }
  .detail-label { color:var(--muted); font-size:12px; }
  .detail-val { color:var(--cream); font-weight:600; }

  /* Progress steps */
  .progress-bar { padding:16px 20px; border-top:1px solid var(--border); }
  .progress-title { font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .steps { position:relative; }
  .step { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
  .step:last-child { margin:0; }
  .step-dot { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; margin-top:1px; transition:all 0.3s; }
  .step-dot.done  { background:var(--gold); border-color:var(--gold); color:var(--dark); }
  .step-dot.active{ background:rgba(200,134,10,0.2); border-color:var(--gold); }
  .step-text { flex:1; }
  .step-name { font-size:13px; font-weight:600; }
  .step-name.done   { color:var(--cream); }
  .step-name.active { color:var(--gold); }
  .step-name.future { color:var(--muted); }
  .step-desc { font-size:11px; color:var(--muted); margin-top:2px; line-height:1.4; }

  /* Items list */
  .items-section { padding:14px 20px; border-top:1px solid var(--border); }
  .items-title { font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .item-line { display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px solid var(--border); }
  .item-line:last-child { border:none; }
  .item-line-name  { color:var(--cream); }
  .item-line-price { color:var(--gold); font-weight:600; }

  /* Total row */
  .total-row { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-top:2px solid var(--border); }
  .total-label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
  .total-val { font-size:20px; font-weight:800; color:var(--gold); }

  /* Error box */
  .error-box { background:rgba(200,16,46,0.1); border:1px solid rgba(200,16,46,0.3); border-radius:3px; padding:16px; margin:0 20px; font-size:14px; color:#e04060; text-align:center; display:none; }
  .error-box.visible { display:block; }

  /* Footer */
  .footer { text-align:center; padding:32px 20px; font-size:11px; color:var(--muted); }
  .footer a { color:var(--gold); text-decoration:none; }
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<div class="header">
  <div class="logo-ring">🍽️</div>
  <div class="brand-name">Tabitha's Restaurant</div>
  <div class="brand-sub">Order Tracker</div>
</div>

<!-- ══ NAV ══ -->
<div class="nav-links">
  <a href="index.html">Order</a>
  <a href="track.html" class="active">Track Order</a>
  <a href="staff.html">Staff</a>
</div>

<!-- ══ SEARCH ══ -->
<div class="search-section">
  <div class="search-title">Track Your Order</div>
  <div class="search-sub">Enter your Order ID to see real-time status</div>
  <input class="search-input" type="text" id="order-id-input"
    placeholder="e.g. TAB-1011-0001"
    maxlength="20"
    oninput="this.value=this.value.toUpperCase()"
    onkeydown="if(event.key==='Enter')doSearch()">
  <button class="search-btn" id="search-btn" onclick="doSearch()">
    <div class="btn-spinner"></div>
    <span class="btn-text">🔍 Track Order</span>
  </button>
</div>

<!-- ══ ERROR ══ -->
<div class="error-box" id="error-box"></div>

<!-- ══ RESULT ══ -->
<div class="result-card" id="result-card">

  <div class="status-stripe" id="status-stripe">
    <div class="status-icon" id="status-icon">⏳</div>
    <div class="status-text">
      <div class="status-label" id="status-label">Status</div>
      <div class="status-value" id="status-value">—</div>
    </div>
  </div>

  <div class="result-body">
    <div class="detail-row">
      <span class="detail-label">Order ID</span>
      <span class="detail-val" id="detail-id">—</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Name</span>
      <span class="detail-val" id="detail-name">—</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Order Type</span>
      <span class="detail-val" id="detail-type">—</span>
    </div>
  </div>

  <div class="items-section">
    <div class="items-title">Items Ordered</div>
    <div id="items-list"></div>
  </div>

  <div class="total-row">
    <span class="total-label">Total</span>
    <span class="total-val" id="detail-total">GHS —</span>
  </div>

  <div class="progress-bar">
    <div class="progress-title">Order Progress</div>
    <div class="steps" id="steps-container"></div>
  </div>

</div>

<!-- ══ FOOTER ══ -->
<div class="footer" style="margin-top:32px;">
  <a href="index.html">← Place a new order</a><br><br>
  Tabitha's Restaurant · Dome, Accra · 🇨🇮🇬🇭
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwL21yH5n8XV97JTuNHGCqDEB01zoSyDZQO_YUYUb42Mm-DW9KR1apzyjV5S7kUEX0P/exec';

const STATUS_INFO = {
  'PENDING':    { icon:'⏳', label:'Awaiting Confirmation', desc:'Your order is received. We are verifying your payment.' },
  'CONFIRMED':  { icon:'✅', label:'Confirmed',             desc:'Your order is confirmed and will be prepared shortly.' },
  'PREPARING':  { icon:'🍳', label:'Being Prepared',        desc:'Your food is being freshly prepared in the kitchen.' },
  'READY':      { icon:'🔔', label:'Ready!',                desc:'Your order is ready for pick-up or dispatch.' },
  'ON_THE_WAY': { icon:'🛵', label:'On the Way',            desc:'Your order is on its way. The rider is coming!' },
  'DONE':       { icon:'🎉', label:'Completed',             desc:'Your order has been delivered. Enjoy your meal!' },
  'CANCELLED':  { icon:'❌', label:'Cancelled',             desc:'This order was cancelled. Contact us for assistance.' },
};

const TYPE_LABELS = {
  'takeaway':'🥡 Takeaway',
  'delivery_pay_now':'🛵 Delivery (prepaid)',
  'delivery_pay_collection':'💵 Delivery (pay on arrival)',
  'dine_in':'🍽️ Dine-in'
};

// Status flow for progress bar (delivery)
const STATUS_FLOW_DELIVERY = ['PENDING','CONFIRMED','PREPARING','READY','ON_THE_WAY','DONE'];
const STATUS_FLOW_PICKUP   = ['PENDING','CONFIRMED','PREPARING','READY','DONE'];

const FLOW_LABELS = {
  'PENDING':    { name:'Order Received',   desc:'Awaiting payment verification' },
  'CONFIRMED':  { name:'Confirmed',        desc:'Kitchen notified' },
  'PREPARING':  { name:'Being Prepared',   desc:'Food is cooking' },
  'READY':      { name:'Ready',            desc:'Ready for pick-up / dispatch' },
  'ON_THE_WAY': { name:'On the Way',       desc:'Rider is on the way to you' },
  'DONE':       { name:'Completed',        desc:'Delivered or collected' },
};

// Auto-fill from URL param
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (id) {
    document.getElementById('order-id-input').value = id.toUpperCase();
    doSearch();
  }
});

async function doSearch() {
  const btn = document.getElementById('search-btn');
  const errBox = document.getElementById('error-box');
  const resCard = document.getElementById('result-card');
  errBox.classList.remove('visible');
  resCard.classList.remove('visible');

  const orderId = document.getElementById('order-id-input').value.trim().toUpperCase();
  if (!orderId || orderId.length < 5) {
    showError('Please enter a valid Order ID (e.g. TAB-1011-0001).');
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const res = await fetch(`${API_URL}?action=order_status&orderId=${encodeURIComponent(orderId)}`);
    const data = await res.json();

    if (data.success) {
      renderResult(data);
    } else {
      showError('Order not found. Please check your Order ID and try again.');
    }
  } catch(err) {
    showError('Could not connect. Check your internet and try again.');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg;
  el.classList.add('visible');
}

function renderResult(data) {
  const status = data.status || 'PENDING';
  const info   = STATUS_INFO[status] || STATUS_INFO['PENDING'];
  const orderType = data.orderType || '';

  // Stripe
  const stripe = document.getElementById('status-stripe');
  stripe.className = 'status-stripe stripe-' + status;
  document.getElementById('status-icon').textContent = info.icon;
  document.getElementById('status-label').className  = 'status-label label-' + status;
  document.getElementById('status-label').textContent = info.label;
  document.getElementById('status-value').textContent  = info.desc;

  // Details
  document.getElementById('detail-id').textContent   = data.orderId || '—';
  document.getElementById('detail-name').textContent  = data.name   || '—';
  document.getElementById('detail-type').textContent  = TYPE_LABELS[orderType] || orderType || '—';
  document.getElementById('detail-total').textContent = 'GHS ' + (data.total || 0);

  // Items
  const items = Array.isArray(data.items) ? data.items : [];
  const itemsEl = document.getElementById('items-list');
  if (items.length) {
    itemsEl.innerHTML = items.map(i =>
      `<div class="item-line">
        <span class="item-line-name">${i.qty}× ${i.name}</span>
        <span class="item-line-price">GHS ${(i.price * i.qty)}</span>
       </div>`
    ).join('');
  } else {
    itemsEl.innerHTML = '<div style="font-size:13px;color:var(--muted);">No items found</div>';
  }

  // Progress bar
  const isDelivery = orderType && orderType.startsWith('delivery');
  const flow = isDelivery ? STATUS_FLOW_DELIVERY : STATUS_FLOW_PICKUP;
  const currentIdx = flow.indexOf(status);

  const stepsHtml = flow.map((s, i) => {
    let dotClass  = 'future';
    let nameClass = 'future';
    let dotContent = (i + 1).toString();
    if (i < currentIdx) { dotClass = 'done'; nameClass = 'done'; dotContent = '✓'; }
    else if (i === currentIdx) { dotClass = 'active'; nameClass = 'active'; dotContent = '●'; }

    const fl = FLOW_LABELS[s];
    return `<div class="step">
      <div class="step-dot ${dotClass}">${dotContent}</div>
      <div class="step-text">
        <div class="step-name ${nameClass}">${fl?.name || s}</div>
        ${i === currentIdx ? `<div class="step-desc">${fl?.desc || ''}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('steps-container').innerHTML = stepsHtml;

  document.getElementById('result-card').classList.add('visible');
  document.getElementById('result-card').scrollIntoView({ behavior:'smooth', block:'start' });
}
</script>
</body>
</html>
